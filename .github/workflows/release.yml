name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release: v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          else {
            [xml]$project = Get-Content "src\RankOn\RankOn.csproj"
            $version = $project.Project.PropertyGroup.Version
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download rank tier asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src\RankOn\Resources" | Out-Null
          curl.exe -L --fail "https://support.playeternalreturn.com/hc/article_attachments/45305347324825" -o "src\RankOn\Resources\rank-tiers.png"
          if (-not (Test-Path "src\RankOn\Resources\rank-tiers.png")) { throw "rank tier asset download failed" }

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet publish src/RankOn/RankOn.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=$version `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output publish

      - name: Generate installer icon
        run: python scripts/generate-installer-icon.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\RankOn.iss"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RankOn v${{ steps.version.outputs.version }}
          body: |
            ## RankOn v${{ steps.version.outputs.version }}

            ### 최근 전적
            - 오버레이에 최근 전적을 2×5 타일로 표시합니다.
            - 1등은 금색, 2등은 은색, 3등은 동색, 4~8등은 회색으로 구분합니다.
            - 설정에서 `프로그램 시작 이후` / `최근 10게임` 기준을 선택할 수 있습니다.
            - `프로그램 시작 이후` 모드에서는 새 세션을 시작하면 최근 전적도 초기화됩니다.
            - PC 오버레이와 OBS 방송 오버레이에 모두 적용됩니다.

            ### 디자인
            - RankOn 전용 H-1 스타일 앱 아이콘을 적용했습니다.
            - 설치 프로그램 아이콘도 새 디자인으로 변경했습니다.
          files: installer/output/RankOn-Setup-*.exe
