name: Publish v1.1.5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.1.5-once.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Windows icons
        run: python scripts/generate-installer-icon.py

      - name: Download rank tier asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src\RankOn\Resources" | Out-Null
          curl.exe -L --fail "https://support.playeternalreturn.com/hc/article_attachments/45305347324825" -o "src\RankOn\Resources\rank-tiers.png"
          if (-not (Test-Path "src\RankOn\Resources\rank-tiers.png")) { throw "rank tier asset download failed" }

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/RankOn/RankOn.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=1.1.5 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.1.5" "installer\RankOn.iss"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          target_commitish: ${{ github.sha }}
          name: RankOn v1.1.5
          make_latest: true
          body: |
            # RankOn v1.1.5

            ## 표시 설정
            - 디자인 → 표시 항목에 `티어 이미지` ON/OFF 옵션을 추가했습니다.
            - 티어 글자와 티어 이미지를 각각 독립적으로 표시하거나 숨길 수 있습니다.
            - PC 오버레이, OBS 방송 오버레이, 실시간 미리보기에 모두 적용됩니다.
            - 티어 이미지를 끄면 남던 불필요한 여백도 함께 제거됩니다.
          files: installer/output/RankOn-Setup-v1.1.5.exe
