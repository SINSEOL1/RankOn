name: Update v1.0.0 Release Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-v1-release-notes-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0 --repo "${{ github.repository }}" --notes-file RELEASE_NOTES_v1.0.0.md
