name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/RankOn/RankOn.csproj

      - name: Build
        run: dotnet build src/RankOn/RankOn.csproj --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish src/RankOn/RankOn.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RankOn-Windows-test
          path: publish/
