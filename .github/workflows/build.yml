name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download rank tier asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src\RankOn\Resources" | Out-Null
          curl.exe -L --fail "https://support.playeternalreturn.com/hc/article_attachments/45305347324825" -o "src\RankOn\Resources\rank-tiers.png"
          if (-not (Test-Path "src\RankOn\Resources\rank-tiers.png")) { throw "rank tier asset download failed" }

      - name: Restore
        run: dotnet restore src/RankOn/RankOn.csproj

      - name: Build
        run: dotnet build src/RankOn/RankOn.csproj --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish src/RankOn/RankOn.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build test installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.0.0" "installer\RankOn.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RankOn-Windows-test
          path: installer/output/RankOn-Setup-*.exe

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: RankOn-Windows-portable
          path: publish/
