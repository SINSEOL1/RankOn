name: Publish v1.1.7

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.1.7-once.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Windows icons
        run: python scripts/generate-installer-icon.py

      - name: Download rank tier asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src\RankOn\Resources" | Out-Null
          curl.exe -L --fail "https://support.playeternalreturn.com/hc/article_attachments/45305347324825" -o "src\RankOn\Resources\rank-tiers.png"
          if (-not (Test-Path "src\RankOn\Resources\rank-tiers.png")) { throw "rank tier asset download failed" }

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/RankOn/RankOn.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Version=1.1.7 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.1.7" "installer\RankOn.iss"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.7
          target_commitish: ${{ github.sha }}
          name: RankOn v1.1.7
          make_latest: true
          body: |
            # RankOn v1.1.7

            ## 수정
            - Vertical 프리셋에서 세션 RP가 왼쪽으로 치우치던 문제를 수정했습니다.
            - PC 오버레이, OBS 오버레이, 디자인 미리보기에서 Vertical 정렬을 동일하게 맞췄습니다.
            - 전적 추가창이 화면 오른쪽 밖으로 밀려나던 문제를 수정했습니다.
            - 전적 추가창이 항상 작업 영역 안에 표시되도록 위치를 자동 보정합니다.
            - 1~8등 버튼 표시가 깨지던 문제를 수정하고 전용 타일 스타일을 적용했습니다.
          files: installer/output/RankOn-Setup-v1.1.7.exe
